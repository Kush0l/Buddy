<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Buddy</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: "Segoe UI", -apple-system, system-ui, sans-serif; }

  /* ---- walker: Buddy peeks out from behind the screen edge, ducks back, peeks again, then hops in.
     The whole entrance takes 3.9s; the hop, bowl, bubble and boop are timed to its last second. ---- */
  #walker {
    position: absolute; right: 12px; bottom: 0; width: 260px; height: 190px;
    transform: translateX(320px); transform-origin: 100% 100%;
    animation: peekIn 3.9s ease-in-out forwards;
  }
  #walker.leaving { animation: walkOut 1.1s cubic-bezier(.6,0,.8,.4) forwards; }
  @keyframes peekIn {
    0%       { transform: translateX(320px) rotate(0); }
    13%, 33% { transform: translateX(110px) rotate(-16deg); } /* leans out for a first peek */
    41%, 54% { transform: translateX(320px) rotate(0); }      /* eep! ducks back behind the edge */
    64%, 77% { transform: translateX(95px) rotate(-10deg); }  /* a second, braver peek */
    100%     { transform: translateX(0) rotate(0); }           /* hops all the way out */
  }
  @keyframes walkOut { from { transform: translateX(0); } to { transform: translateX(340px); } }

  #look { animation: look 3.9s ease-in-out forwards; }
  @keyframes look {
    0%, 16%   { transform: translateX(0); }
    20%, 26%  { transform: translateX(-5px); } /* glances across your screen */
    30%, 66%  { transform: translateX(2px); }
    70%, 76%  { transform: translateX(-5px); }
    80%, 100% { transform: translateX(0); }
  }

  #alert { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; animation: alert 3.9s forwards; }
  @keyframes alert {
    0%, 72% { opacity: 0; transform: scale(.2); }
    76%     { opacity: 1; transform: scale(1.2); }
    80%, 88% { opacity: 1; transform: scale(1); }
    94%, 100% { opacity: 0; transform: scale(1); }
  }

  #dog { position: absolute; right: 0; bottom: 0; width: 180px; height: 180px; cursor: pointer; overflow: visible;
         filter: drop-shadow(0 6px 6px rgba(0,0,0,.18)); }
  #hopper { transform-origin: 100px 195px; animation: hop .3s ease-in-out 3s 3; }
  #walker.leaving #hopper { animation: hop .3s ease-in-out infinite; }
  #hopper.boing { animation: boing .45s ease-out; }
  @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px) rotate(-3deg); } }
  @keyframes boing { 0%,100% { transform: translateY(0) scale(1); } 30% { transform: translateY(-20px) scale(1.05,.95); } 60% { transform: translateY(0) scale(1.08,.92); } }

  #tail { transform-origin: 140px 152px; animation: wag .28s ease-in-out infinite alternate; }
  @keyframes wag { from { transform: rotate(-18deg); } to { transform: rotate(16deg); } }

  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

  #head { transform-origin: 100px 112px; animation: tilt 3.2s ease-in-out 4s infinite; }
  @keyframes tilt { 0%,60%,100% { transform: rotate(0); } 70%,88% { transform: rotate(-8deg); } }

  #earL { transform-origin: 66px 52px; animation: earL 3.2s ease-in-out infinite; }
  #earR { transform-origin: 134px 52px; animation: earR 3.2s ease-in-out infinite; }
  @keyframes earL { 0%,80%,100% { transform: rotate(0); } 85% { transform: rotate(10deg); } 90% { transform: rotate(-4deg); } }
  @keyframes earR { 0%,80%,100% { transform: rotate(0); } 85% { transform: rotate(-10deg); } 90% { transform: rotate(4deg); } }

  #tongue { transform-box: fill-box; transform-origin: top center; transform: scaleY(.6); transition: transform .2s; }
  #dog:hover #tongue { transform: scaleY(1.25); }

  /* ---- sad: shown when you tap "Later" ---- */
  #brows, #frown, #tear { opacity: 0; transition: opacity .3s; }
  body.sad #brows, body.sad #frown { opacity: 1; }
  body.sad #smile { opacity: 0; }
  body.sad #tongue, body.sad #dog:hover #tongue { transform: scaleY(0); }
  body.sad #tail { animation: tailDroop .6s ease-out forwards; }
  body.sad #earL { animation: earDroopL .5s ease-out forwards; }
  body.sad #earR { animation: earDroopR .5s ease-out forwards; }
  body.sad #head { animation: headDroop .6s ease-out forwards; }
  body.sad #look { animation: lookDown .4s ease-out forwards; }
  body.sad #tear { animation: tear 1.3s ease-in .4s infinite; }
  body.sad #walker.leaving { animation: walkOut 2.2s ease-in forwards; }
  body.sad #walker.leaving #hopper { animation: plod .55s ease-in-out infinite; }
  @keyframes tailDroop { to { transform: rotate(95deg); } }
  @keyframes earDroopL { to { transform: rotate(-14deg); } }
  @keyframes earDroopR { to { transform: rotate(14deg); } }
  @keyframes headDroop { to { transform: translateY(5px) rotate(5deg); } }
  @keyframes lookDown { to { transform: translateY(2.5px); } }
  @keyframes tear { 0% { opacity: 0; transform: translateY(0); } 15%, 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(22px); } }
  @keyframes plod { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  /* ---- puppy eyes: tapping 🔕 gets the full innocent, emotional-blackmail treatment (on top of sad) ---- */
  #puppyEyes, #tear2 { opacity: 0; transition: opacity .3s; }
  body.puppy #look { opacity: 0; }
  body.puppy #puppyEyes { opacity: 1; }
  body.puppy #bowl .contents { opacity: 0; } /* "…with my empty bowl" */
  body.puppy #head { animation: puppyTilt .8s ease-out forwards; }
  body.puppy #frown { animation: tremble .18s linear infinite; }
  body.puppy #tear2 { opacity: 1; animation: tear 1.3s ease-in .9s infinite; }
  body.puppy #hopper { animation: shiver .25s linear infinite; }
  body.puppy #walker.leaving { animation: walkOutLookBack 4s ease-in-out forwards; }
  body.puppy #walker.leaving #hopper { animation: plod .7s ease-in-out infinite; }
  @keyframes puppyTilt { to { transform: translateY(4px) rotate(-12deg); } }
  @keyframes tremble { 0%,100% { transform: translate(0,0); } 50% { transform: translate(.6px,.8px); } }
  @keyframes shiver { 0%,100% { transform: translateX(0); } 50% { transform: translateX(1px); } }
  @keyframes walkOutLookBack { 0% { transform: translateX(0); } 35%, 60% { transform: translateX(95px); } 100% { transform: translateX(340px); } }

  /* ---- weak: the bar this reminder is about is low; eating: lapping from the bowl ---- */
  body.weak #brows { opacity: 1; }
  #bowl .contents { transition: opacity .8s .3s; }
  body.weak #bowl .contents { opacity: 0; } /* empty bowl until you drink/eat */
  #thought { left: 186px; top: -40px; }
  body.weak #tail { animation-duration: 1s; }
  /* eating: the bowl slides in front of Buddy, he dips his head and laps until it's empty */
  body.eating #bowl { z-index: 2; animation: bowlToMouth .45s ease-out forwards; }
  body.eating #bowl .contents { transform-box: fill-box; transform-origin: 50% 100%; animation: drain 2s ease-in .6s forwards; }
  body.eating #head { animation: lap .38s ease-in-out .35s 6; }
  body.eating #tongue { transform: scaleY(1.3); }
  @keyframes bowlToMouth { from { opacity: 1; transform: scale(1); } to { opacity: 1; transform: translateX(var(--to-mouth, 118px)) scale(.85); } }
  @keyframes drain { from { opacity: 1; transform: scaleY(1); } to { opacity: 0; transform: scaleY(.3); } }
  @keyframes lap { 50% { transform: translate(-3px, 30px) rotate(-5deg); } }

  /* picture looks (e.g. the Shih Tzu sticker) move as one piece: gentler lapping, a greyer sad mood */
  #head image { transition: filter .4s; transform-box: fill-box; transform-origin: 50% 100%;
                animation: breathe 2.8s ease-in-out infinite;
                pointer-events: none; /* its transparent corners must not catch clicks; .hitbox does */ }
  #bubble { z-index: 2; } /* the pet (a picture's box especially) must never cover the buttons */
  .lid { transform-box: fill-box; transform-origin: 50% 0; animation: lidBlink 4.2s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.012, 1.02); } }
  @keyframes lidBlink { 0%, 91%, 100% { transform: scaleY(0); } 94%, 96% { transform: scaleY(1); } }
  body.img-pet.sad #head image { filter: saturate(.55) brightness(.96); }
  /* eating: only the head layer dips toward the bowl while the tongue laps */
  body.img-pet.eating #imgHead { animation: imgDip .52s ease-in-out .35s 5; }
  body.img-pet.eating #imgTongue { opacity: 1; transform-box: fill-box; transform-origin: 50% 0;
                                   animation: lick .26s ease-in-out .35s infinite alternate; }
  @keyframes imgDip { 50% { transform: translateY(12px) rotate(-4deg); } }
  @keyframes lick { from { transform: scaleY(.35); } to { transform: scaleY(1.15); } }
  /* sad: the happy face fades to the original pout, with wet streaks under the falling tears */
  .happyFace { transition: opacity .4s; }
  body.sad .happyFace { opacity: 0; }
  .streak { transition: opacity .6s .3s; }
  body.sad .streak { opacity: .75; }

  /* Buddy brings the bowl along and sets it down once fully out. */
  #bowl { position: absolute; left: 6px; bottom: 2px; width: 92px; height: 70px;
          opacity: 0; transform: scale(.3); transform-origin: 50% 100%;
          animation: bowlIn .4s cubic-bezier(.3,1.6,.5,1) 3.7s forwards; }
  @keyframes bowlIn { to { opacity: 1; transform: scale(1); } }
  #bowl .drop { animation: drip 1.6s ease-in infinite; }
  @keyframes drip { 0% { transform: translateY(-14px); opacity: 0; } 30% { opacity: 1; } 80% { transform: translateY(10px); opacity: 1; } 100% { transform: translateY(14px); opacity: 0; } }

  /* ---- speech bubble ---- */
  #bubble {
    position: absolute; right: 120px; bottom: 165px; width: 214px; box-sizing: border-box;
    background: #fff; color: #2b2118; border-radius: 18px; padding: 11px 12px 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.06);
    transform-origin: 85% 110%; transform: scale(0); opacity: 0;
    animation: pop .45s cubic-bezier(.3,1.6,.5,1) 3.8s forwards;
  }
  #bubble::after { content: ""; position: absolute; right: 22px; bottom: -11px; width: 22px; height: 22px;
                   background: #fff; transform: rotate(45deg); border-radius: 0 0 5px 0;
                   box-shadow: 4px 4px 6px rgba(0,0,0,.06); }
  #bubble.leaving { animation: unpop .25s ease-in forwards; transform: scale(1); opacity: 1; }
  @keyframes pop { to { transform: scale(1); opacity: 1; } }
  @keyframes unpop { to { transform: scale(0); opacity: 0; } }

  #done { background: #26a69a; }
  #snooze, #busy { background: #f1ebe4; color: #5b4a3c; }
</style>
<link rel="stylesheet" href="common.css">
</head>
<body>
  <div id="bubble" class="hit">
    <div class="head"><span id="icon"></span><h1 id="title"></h1></div>
    <div class="row">
      <button id="done"></button>
      <button id="snooze"></button>
      <button id="busy"></button>
    </div>
    <div id="meters" class="petbar"></div>
  </div>

  <div id="walker">
    <svg id="bowl" viewBox="0 0 92 70"></svg>
    <div id="thought" class="thought"></div>

    <svg id="dog" class="hit" viewBox="0 0 200 200">
      <text id="alert" x="44" y="34" font-size="34" font-weight="900" fill="#e5484d"
            font-family="Segoe UI, system-ui, sans-serif">!</text>
    </svg>
  </div>

<script src="pets.js"></script>
<script src="common.js"></script>
<script>
  // Draw Buddy in the look you picked (a dog breed or a cat).
  const breed = BREEDS[q.get('breed')] ? q.get('breed') : 'beagle';
  const isCat = BREEDS[breed].species === 'cat';
  $('dog').insertAdjacentHTML('beforeend', petArt(breed));
  const picture = BREEDS[breed].image;
  if (picture) {
    document.body.classList.add('img-pet');
    $('bowl').style.setProperty('--to-mouth', `${28 + picture.mouth[0] * 0.9}px`); // slide the bowl under its mouth
  }

  fillBubble('Buddy');

  const KIBBLE = `
    <ellipse cx="46" cy="38" rx="31" ry="7" fill="#9b6233"/>
    <circle cx="34" cy="35" r="5" fill="#b77a45"/><circle cx="48" cy="33" r="5" fill="#a86c39"/>
    <circle cx="60" cy="36" r="5" fill="#b77a45"/><circle cx="42" cy="38" r="4" fill="#8b552b"/>
    <g transform="rotate(-20 50 22)">
      <rect x="36" y="18" width="30" height="8" rx="4" fill="#fff4e0"/>
      <circle cx="36" cy="17" r="5" fill="#fff4e0"/><circle cx="36" cy="27" r="5" fill="#fff4e0"/>
      <circle cx="66" cy="17" r="5" fill="#fff4e0"/><circle cx="66" cy="27" r="5" fill="#fff4e0"/>
    </g>`;
  const FISH = `
    <ellipse cx="46" cy="38" rx="31" ry="7" fill="#d9e4ee"/>
    <g transform="rotate(-12 46 30)">
      <path d="M58 30 L71 21 L71 39 Z" fill="#5f9bd1"/>
      <ellipse cx="44" cy="30" rx="17" ry="9" fill="#7fb3e0"/>
      <path d="M40 22 Q46 30 40 38" stroke="#5f9bd1" stroke-width="2" fill="none"/>
      <circle cx="34" cy="28" r="2.2" fill="#1b2a3a"/>
    </g>`;

  $('bowl').innerHTML = kind === 'water'
    ? `<path d="M8 40 H84 Q80 66 46 66 Q12 66 8 40 Z" fill="#4a90d9"/>
       <ellipse cx="46" cy="40" rx="38" ry="8" fill="#2f6fb3"/>
       <g class="contents">
         <ellipse cx="46" cy="40" rx="38" ry="8" fill="#9fd0ff"/>
         <ellipse cx="46" cy="40" rx="30" ry="5" fill="#cfe8ff"/>
         <path class="drop" d="M46 8 Q53 18 53 22 A7 7 0 0 1 39 22 Q39 18 46 8 Z" fill="#6bb6ff"/>
       </g>`
    : `<path d="M8 40 H84 Q80 66 46 66 Q12 66 8 40 Z" fill="#e5484d"/>
       <ellipse cx="46" cy="40" rx="38" ry="8" fill="#ff8a8f"/>
       <ellipse cx="46" cy="40" rx="31" ry="6" fill="#b8343a"/>
       <g class="contents">${isCat ? FISH : KIBBLE}</g>`;

  enableClickThrough();

  let gone = false;
  function walkAway(action, walkMs) {
    api.setIgnoreMouse(true);
    $('bubble').classList.add('leaving');
    $('walker').classList.add('leaving');
    setTimeout(() => api.respond(action), walkMs);
  }

  function leave(action) {
    if (gone) return;
    gone = true;
    walkAway(action, 1150);
  }

  // "Later": Buddy droops, says he won't drink/eat without you either, then plods off slowly.
  function sadLeave() {
    if (gone) return;
    gone = true;
    document.body.classList.add('sad');
    react('🥺', `No ${needIcon} for me then…`);
    petSkips();
    whimper();
    setTimeout(() => walkAway('snooze', 2200), 2800);
  }

  // "Drank it" / "Ate it": Buddy pulls the bowl over and laps it empty while his bar fills,
  // then trots off happy.
  function eatWithYou() {
    if (gone) return;
    gone = true;
    document.body.classList.add('eating');
    react(needIcon, kind === 'water' ? 'Ahh! ❤️' : 'Yum! ❤️');
    feedPet();
    woof();
    const words = kind === 'water'
      ? (isCat ? ['lap lap!', 'lap!', 'purr~'] : ['slurp!', 'slurp!', 'ahh~'])
      : (isCat ? ['nom!', 'nom nom!', 'purr~'] : ['nom!', 'nom nom!', 'yum!']);
    words.forEach((word, i) => setTimeout(() => popText($('walker'), word, picture ? 22 + i * 8 : 96 + i * 28, 70 - i * (picture ? 14 : 8)), 600 + i * 700));
    if (picture) {
      // A picture can't reach into the bowl, so sips/bites fly up from the bowl into its mouth as its head dips.
      const bite = kind === 'water' ? '💧' : needIcon;
      const mouth = [80 + picture.mouth[0] * 0.9, 10 + picture.mouth[1] * 0.9 + 10]; // in the walker, head dipped
      for (let i = 0; i < 4; i++) flyInto($('walker'), bite, [mouth[0], 158], mouth, 450 + i * 520);
    }
    setTimeout(() => walkAway('done', 1150), 2900);
  }

  $('done').onclick = eatWithYou;
  $('snooze').onclick = sadLeave;
  // 🔕: Buddy gives you the full puppy eyes (a little emotional blackmail), then shuffles off
  // very slowly, stopping halfway to sniffle at you one more time.
  function puppyEyesLeave() {
    if (gone) return;
    gone = true;
    document.body.classList.add('sad', 'puppy');
    react('🥺', "You don't want me…?");
    petSkips();
    whimper();
    setTimeout(whimper, 900);
    setTimeout(() => popText($('walker'), 'sniff…', 64, 44), 1400);
    setTimeout(() => {
      walkAway('busy', 4000);
      setTimeout(() => popText($('walker'), 'sniff…', 64, 44), 1700);
    }, 4200);
  }

  $('busy').onclick = puppyEyesLeave;
  api.onLeave((action) => leave(action));
  setTimeout(() => leave('snooze'), timeoutSec * 1000);

  const hopper = $('hopper');
  $('dog').onclick = () => {
    hopper.classList.remove('boing');
    void hopper.getBBox();
    hopper.classList.add('boing');
    woof();
  };

  const woof = () => playTones(isCat
    ? [{ freq: 620, dur: 0.16, to: 1.35, vibrato: 6 }, { freq: 840, at: 0.16, dur: 0.38, to: 0.6, vibrato: 8 }] // "mi-aow"
    : [{ freq: 520, dur: 0.15, to: 0.7 }, { freq: 660, at: 0.16, dur: 0.15, to: 0.7 }]); // happy "boop-boop"
  const whimper = () => playTones(isCat
    ? [{ freq: 900, dur: 0.7, to: 0.55, vibrato: 10, volume: 0.12 }] // sad "mew…"
    : [{ freq: 640, dur: 0.6, to: 0.55 }]); // sad falling "aww"
  setTimeout(woof, 3800); // announce arrival as the bubble pops up
  setTimeout(showThought, 4000);
</script>
</body>
</html>
